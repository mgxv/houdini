name: macOS-latest weekly

# Early-warning canary against macOS upgrade regressions in the
# scrapers we depend on (Dock's `dock-visibility` log channel,
# MediaRemote framework). Runs `swift test` on `macos-latest`
# weekly. Failure here is a heads-up, not a release gate — the
# main `ci.yml` job (pinned to macos-15) is the merge gate.

on:
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests on macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: |
          sw_vers
          swift --version
      - name: swift test
        run: swift test -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -strict-concurrency=complete
